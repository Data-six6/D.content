version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/Dockerfile
    container_name: dcp_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./ml:/app/ml
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: dcp_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

  db:
    image: postgres:16
    container_name: dcp_db
    restart: always
    environment:
      POSTGRES_DB: digital_content_predictor
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
